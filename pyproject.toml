[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "climate_change_on_sea_urchins"
version = "1.5.0"
description = "Open-source, FAIR pipeline integrating Copernicus Marine oceanographic data with biological sentinel bioassay data, with Paracentrotus lividus EC50 toxicity as a proof of concept"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Guido Scatena", email = "guido.scatena@isprambiente.it" },
    { name = "Andrea Gaion" , email = "andrea.gaion@isprambiente.it" },
    { name = "Davide Sartori" , email = "davide.scartori@isprambiente.it" },
]
keywords = [
    "marine heatwaves",
    "climate change",
    "ecotoxicology",
    "open science",
    "FAIR data",
    "oceanography",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pandas>=2.0,<3.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "streamlit>=1.35,<1.57",
    "plotly>=5.18",
    "Pillow>=10.0",
    "skccm==0.2.dev0",
    "pycwt==0.4.0b0",
    "pydantic>=2,<3",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
acquisition = ["copernicusmarine", "xarray", "netcdf4", "h5netcdf"]
notebook = ["jupyter", "nbconvert"]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/scatenag/climate_change_on_sea_urchins"
Repository = "https://github.com/scatenag/climate_change_on_sea_urchins"
Documentation = "https://github.com/scatenag/climate_change_on_sea_urchins/blob/main/docs/ADAPTING.md"

[project.scripts]
ccsu-run-pipeline = "climate_change_on_sea_urchins.pipeline:main"
ccsu-dashboard     = "climate_change_on_sea_urchins._launch_dashboard:main"
ccsu-validate-study = "climate_change_on_sea_urchins.study_spec:validate_study_cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "golden: full-pipeline regression test against tests/fixtures/results_v1_5_0/ (slow: reruns the whole pipeline, plus R/DLNM if available -- run alone with `pytest -m golden`)",
]
